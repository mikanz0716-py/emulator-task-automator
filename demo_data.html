<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ダミーレビューデータ</title>
</head>
<body>
    <h1>公開製品レビュー (ダミー)</h1>
    <div id="product-reviews">
        <div class="review-card" data-id="101">
            <h2 class="product-name">製品X (モデルA)</h2>
            <span class="rating">★★★★★</span>
            <p class="comment">この自動化機能は期待通りでした。特に処理速度に満足しています。</p>
            <span class="date">2025/08/10</span>
        </div>
        <div class="review-card" data-id="102">
            <h2 class="product-name">製品Y (モデルB)</h2>
            <span class="rating">★★★☆☆</span>
            <p class="comment">機能は良いが、セットアップに時間がかかりました。説明書が少し不親切です。</p>
            <span class="date">2025/08/15</span>
        </div>
        <div class="review-card" data-id="103">
            <h2 class="product-name">製品X (モデルA)</h2>
            <span class="rating">★★★★☆</span>
            <p class="comment">安定して動作しています。頻繁なアップデートにも対応しており安心です。</p>
            <span class="date">2025/09/01</span>
        </div>
    </div>
</body>
</html>
